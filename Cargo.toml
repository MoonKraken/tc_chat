[package]
name = "tc_chat"
version = "0.1.0"
edition = "2024"
description = "A streaming chat app on Topcoat, with in-process mistral.rs or Ollama via rig."

[dependencies]
ammonia = "4"
dotenvy = "0.15"
futures = "0.3"
mistralrs = "0.8"
pulldown-cmark = "0.13"
rig = { version = "0.43.0", default-features = false, features = ["reqwest"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
topcoat = { version = "0.9.0", features = ["tailwind"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
topcoat = { version = "0.9.0", default-features = false, features = ["tailwind"] }

[features]
# Apple Silicon GPU. CPU inference is the default build.
metal = ["mistralrs/metal"]
accelerate = ["mistralrs/accelerate"]
cuda = ["mistralrs/cuda"]
